version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host

    ports:
      - "8000:8000"

    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.75
      --max-model-len 8192
      --limit-mm-per-prompt '{"image":1,"video":0}'
      --mm-processor-kwargs '{"max_pixels":401408,"min_pixels":3136}'
      --enforce-eager

    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 30


  ingest:
    build: .
    container_name: rag-ingest

    command: python ingestion.py

    # Give DocLayout-YOLO access to NVIDIA GPU
    gpus: all

    shm_size: '8gb'

    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      - VLLM_API_KEY=EMPTY
      - MALLOC_ARENA_MAX=1

      # Thread limits
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1

      # NVIDIA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./extracted_visuals:/app/extracted_visuals
      - ~/.cache/huggingface:/root/.cache/huggingface

    depends_on:
      vllm:
        condition: service_healthy


  rag-api:
    build: .
    container_name: rag-api
    restart: unless-stopped

    command: uvicorn api:app --host 0.0.0.0 --port 8080

    ports:
      - "8080:8080"

    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      - VLLM_API_KEY=EMPTY
      - MALLOC_ARENA_MAX=1

      # CPU thread limits
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1

    volumes:
      - ./chroma_db:/app/chroma_db
      - ./extracted_visuals:/app/extracted_visuals
      - ~/.cache/huggingface:/root/.cache/huggingface

    depends_on:
      ingest:
        condition: service_completed_successfully
      vllm:
        condition: service_healthy
